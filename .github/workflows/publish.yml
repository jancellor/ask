name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Read package info
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check npm for published version
        id: npm
        run: |
          PUBLISHED_VERSION="$(npm view "${{ steps.pkg.outputs.name }}" version 2>/dev/null || true)"
          echo "published_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: should_publish
        run: |
          if [ "${{ steps.pkg.outputs.version }}" = "${{ steps.npm.outputs.published_version }}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version detected; publishing."
          fi

      - name: Publish package
        if: steps.should_publish.outputs.publish == 'true'
        run: npm publish --access public
